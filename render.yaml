services:
  - type: web
    name: paavan-setu-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    # Production start: plain `node server.js`. Never `npm run dev` — that runs
    # nodemon (a devDependency), which watches the filesystem and restarts the
    # process on Render's ephemeral disk churn.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Same secret as entered in Razorpay Dashboard → Settings → Webhooks for
      # https://<api-host>/api/orders/webhook
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Where "new paid order" emails go.
      - key: EMAIL_USER
        sync: false
      # Optional: a sender on a Resend-verified domain (e.g.
      # "Paavan Setu <orders@paavansetu.com>"). Enables customer receipts.
      - key: ORDER_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
